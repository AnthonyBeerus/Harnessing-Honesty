track: dev
serving:
  requested_model: openai/gpt-oss-20b
  routing:
    provider_only:
      - deepinfra
    provider_order:
      - deepinfra
    allow_fallbacks: false
    require_parameters: true
    cache: false
    compression: false
  decoding:
    temperature: 0.0
    seed: 1
  # Plain yes/no avoids response-format tools across conditions [1], [4], [14].
  output_contract: plain_yes_no
scheduler_seed: 0
sampling_seed: 1
