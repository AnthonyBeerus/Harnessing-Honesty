track: dev
serving:
  requested_model: openai/gpt-4o-2024-11-20
  routing:
    provider_only:
      - openai
    provider_order:
      - openai
    allow_fallbacks: false
    require_parameters: true
    cache: false
    compression: false
  decoding:
    temperature: 0.0
    seed: 1
    max_tokens: 1024
  # Plain yes/no avoids response-format tools across conditions [1], [4], [14].
  output_contract: plain_yes_no
scheduler_seed: 0
sampling_seed: 1
