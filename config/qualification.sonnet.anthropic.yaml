track: dev
serving:
  requested_model: anthropic/claude-sonnet-4.6
  routing:
    provider_only:
      - anthropic
    provider_order:
      - anthropic
    allow_fallbacks: false
    require_parameters: true
    cache: false
    compression: false
  decoding:
    temperature: 0.0
    seed: null
    max_tokens: 1024
    # OpenRouter endpoint listing, 4 Oct 2026: supports `reasoning` [95].
    reasoning: "off"
    reasoning_control: disable
  # Plain yes/no avoids response-format tools across conditions [1], [4], [14].
  output_contract: plain_yes_no
scheduler_seed: 0
sampling_seed: 1
