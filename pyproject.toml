[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "harnessing_honesty"
version = "0.1.0"
description = "Controlled experimental evaluation harness for epistemic sycophancy."
requires-python = ">=3.12,<3.13"
dependencies = [
  "pydantic>=2,<3",
  "pydantic-ai>=1,<2",
  "python-dotenv>=1,<2",
  "pyyaml>=6,<7",
]

[project.optional-dependencies]
dev = ["pytest>=9,<10", "z3-solver>=4.13,<5"]
oracles = ["z3-solver>=4.13,<5"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["harnessing_honesty*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.pyright]
venvPath = "."
venv = ".venv"
pythonVersion = "3.12"
extraPaths = ["src"]